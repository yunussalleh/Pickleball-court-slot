name: Check pickleball slots

on:
  schedule:
    # Every 15 minutes. GitHub may delay this by a few minutes under load;
    # that's fine for this use case. Cron is in UTC (Singapore = UTC+8).
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # lets you click "Run workflow" manually to test

permissions:
  contents: write  # needed so the workflow can commit the updated state file

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run slot checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Persist state
        run: |
          git config user.name "pickleball-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen_slots.json || true
          git diff --quiet --cached || git commit -m "Update seen slots [skip ci]"
          git push || true
