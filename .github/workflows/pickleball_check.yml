name: Check pickleball slots

on:
  schedule:
    # Every 5 minutes -- GitHub's practical minimum. May still be delayed
    # a few minutes under load; that's outside our control. Cron is in
    # UTC (Singapore = UTC+8).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # lets you click "Run workflow" manually to test

permissions:
  contents: write  # needed so the workflow can commit the updated state file

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pickleball-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run slot checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Upload debug evidence (only present if a checker failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-failures
          path: pickleball-bot/debug_failures/
          if-no-files-found: ignore
          retention-days: 3

      - name: Persist state
        run: |
          git config user.name "pickleball-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen_slots.json state/failure_streaks.json
          git diff --quiet --cached || git commit -m "Update seen slots [skip ci]"
          git push || true
